<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" fill="none">
  <defs>
    <linearGradient id="bg" x1="112" y1="58" x2="1328" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#112B45"/>
      <stop offset="0.55" stop-color="#1C588C"/>
      <stop offset="1" stop-color="#198975"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#226FB2"/>
      <stop offset="1" stop-color="#198975"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1440" height="860" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#102239" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 36px 'Segoe UI', Arial, sans-serif; fill: #F7FBFF; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #DCEBFA; }
      .eyebrow { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; fill: #9FD3FF; }
      .stepNo { font: 800 28px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .stepKicker { font: 700 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; fill: #5B6D80; }
      .stepTitle { font: 800 20px 'Segoe UI', Arial, sans-serif; fill: #11263B; }
      .copy { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #607285; }
      .mini { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0D7A73; }
      .outTitle { font: 800 18px 'Segoe UI', Arial, sans-serif; fill: #12314F; }
      .pill { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #176A5E; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#EDF4F8"/>
  <g filter="url(#shadow)">
    <rect x="34" y="30" width="1372" height="796" rx="34" fill="#F7FBFF"/>
  </g>

  <rect x="64" y="52" width="1312" height="122" rx="30" fill="url(#bg)"/>
  <text x="100" y="93" class="eyebrow">Document AI automation case</text>
  <text x="100" y="133" class="title">Document AI Ops Intake Workflow</text>
  <text x="100" y="162" class="subtitle">Mixed operational documents become validated outputs, review queues, and spreadsheet-ready data products</text>

  <rect x="116" y="420" width="1208" height="12" rx="6" fill="#DDE7F0"/>
  <rect x="116" y="420" width="1208" height="12" rx="6" fill="url(#track)" opacity="0.9"/>

  <circle cx="190" cy="426" r="26" fill="#226FB2"/>
  <text x="180" y="435" class="stepNo">1</text>
  <circle cx="490" cy="426" r="26" fill="#2A7FB1"/>
  <text x="480" y="435" class="stepNo">2</text>
  <circle cx="790" cy="426" r="26" fill="#238A98"/>
  <text x="780" y="435" class="stepNo">3</text>
  <circle cx="1090" cy="426" r="26" fill="#198975"/>
  <text x="1080" y="435" class="stepNo">4</text>

  <rect x="70" y="224" width="252" height="164" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="98" y="260" class="stepKicker">Inputs</text>
  <text x="98" y="294" class="stepTitle">Collect</text>
  <text x="98" y="326" class="copy">Work orders, technician notes,</text>
  <text x="98" y="350" class="copy">inspection files, vendor requests,</text>
  <text x="98" y="374" class="copy">and parts forms move through</text>
  <text x="98" y="398" class="copy">one intake lane.</text>

  <rect x="365" y="230" width="250" height="154" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="398" y="260" class="stepKicker">Stage 1</text>
  <text x="398" y="294" class="stepTitle">Register</text>
  <text x="398" y="326" class="copy">Capture source metadata, raw</text>
  <text x="398" y="350" class="copy">text excerpts, and lineage for</text>
  <text x="398" y="374" class="copy">every incoming document.</text>

  <rect x="660" y="230" width="260" height="154" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="698" y="260" class="stepKicker">Stage 2</text>
  <text x="698" y="294" class="stepTitle">Extract</text>
  <text x="698" y="326" class="copy">Normalize asset, site, priority,</text>
  <text x="698" y="350" class="copy">category, cost, and routing</text>
  <text x="698" y="374" class="copy">fields for downstream use.</text>

  <rect x="955" y="230" width="350" height="154" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="998" y="260" class="stepKicker">Stage 3</text>
  <text x="998" y="294" class="stepTitle">Validate and publish</text>
  <text x="998" y="326" class="copy">Check dates, required values,</text>
  <text x="998" y="350" class="copy">and field quality before release.</text>
  <text x="998" y="374" class="copy">Publish clean outputs and exceptions.</text>

  <line x1="190" y1="384" x2="190" y2="400" stroke="#226FB2" stroke-width="6" stroke-linecap="round"/>
  <line x1="490" y1="384" x2="490" y2="400" stroke="#2A7FB1" stroke-width="6" stroke-linecap="round"/>
  <line x1="790" y1="384" x2="790" y2="400" stroke="#238A98" stroke-width="6" stroke-linecap="round"/>
  <line x1="1090" y1="384" x2="1090" y2="400" stroke="#198975" stroke-width="6" stroke-linecap="round"/>

  <rect x="202" y="486" width="276" height="148" rx="24" fill="#F6FAFE" stroke="#D5E1EC"/>
  <text x="230" y="520" class="stepKicker">Input Types</text>
  <text x="230" y="552" class="mini">TXT</text>
  <text x="278" y="552" class="copy">work orders and vendor notes</text>
  <text x="230" y="582" class="mini">MD</text>
  <text x="278" y="582" class="copy">technician service reports</text>
  <text x="230" y="612" class="mini">CSV</text>
  <text x="278" y="612" class="copy">inspection and parts exports</text>

  <rect x="582" y="486" width="248" height="148" rx="24" fill="#F8FBFD" stroke="#D5E1EC"/>
  <text x="610" y="520" class="stepKicker">Control Layer</text>
  <text x="610" y="552" class="outTitle">validation_issues</text>
  <text x="610" y="584" class="copy">Flags missing fields, invalid</text>
  <text x="610" y="608" class="copy">dates, numeric errors, and</text>
  <text x="610" y="632" class="copy">records that need review.</text>

  <rect x="934" y="486" width="390" height="250" rx="26" fill="#F7FCFB" stroke="#B7DDD4"/>
  <text x="964" y="520" class="stepKicker">Outputs</text>
  <text x="964" y="552" class="outTitle">Business-ready deliverables</text>

  <rect x="964" y="578" width="330" height="38" rx="19" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="986" y="602" class="pill">master_operational_intake.xlsx</text>

  <rect x="964" y="628" width="228" height="38" rx="19" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="986" y="652" class="pill">exceptions_queue.csv</text>

  <rect x="1206" y="628" width="88" height="38" rx="19" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="1234" y="652" class="pill">.xlsx</text>

  <rect x="964" y="678" width="196" height="38" rx="19" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="986" y="702" class="pill">validation_results.csv</text>

  <rect x="1174" y="678" width="120" height="38" rx="19" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="1198" y="702" class="pill">dashboard.html</text>
</svg>
