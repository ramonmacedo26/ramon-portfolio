<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" fill="none">
  <defs>
    <linearGradient id="hero" x1="72" y1="44" x2="1368" y2="154" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102A44"/>
      <stop offset="1" stop-color="#1E6AAA"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0E7B74"/>
      <stop offset="1" stop-color="#226FB2"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1440" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#102239" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 34px 'Segoe UI', Arial, sans-serif; fill: #F7FBFF; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #DCEBFA; }
      .kicker { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.4px; text-transform: uppercase; fill: #2C70AD; }
      .cardTitle { font: 800 18px 'Segoe UI', Arial, sans-serif; fill: #132238; }
      .copy { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #617284; }
      .pill { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #0E7B74; }
      .muted { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #6D7C8C; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#EDF4F8"/>
  <g filter="url(#shadow)">
    <rect x="30" y="28" width="1380" height="764" rx="32" fill="#F7FBFF"/>
  </g>

  <rect x="58" y="48" width="1324" height="110" rx="28" fill="url(#hero)"/>
  <text x="92" y="96" class="title">Document AI Ops Intake - Workflow</text>
  <text x="92" y="128" class="subtitle">Semi-structured operational documents become validated outputs, review queues, and reporting-ready datasets</text>

  <rect x="82" y="210" width="250" height="264" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="108" y="244" class="kicker">Inputs</text>
  <text x="108" y="278" class="cardTitle">Operational document inbox</text>
  <text x="108" y="316" class="copy">- Work orders</text>
  <text x="108" y="348" class="copy">- Technician reports</text>
  <text x="108" y="380" class="copy">- Inspection checklists</text>
  <text x="108" y="412" class="copy">- Vendor requests</text>
  <text x="108" y="444" class="copy">- Parts request forms</text>

  <rect x="388" y="210" width="250" height="264" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="414" y="244" class="kicker">Stage 1</text>
  <text x="414" y="278" class="cardTitle">Bronze registration</text>
  <text x="414" y="316" class="copy">- Register source metadata</text>
  <text x="414" y="348" class="copy">- Preserve raw excerpts</text>
  <text x="414" y="380" class="copy">- Track original document type</text>
  <text x="414" y="412" class="copy">- Keep lineage by file and record</text>

  <rect x="694" y="210" width="262" height="264" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="720" y="244" class="kicker">Stage 2</text>
  <text x="720" y="278" class="cardTitle">Extraction and normalization</text>
  <text x="720" y="316" class="copy">- Capture fields like asset, site,</text>
  <text x="720" y="340" class="copy">  priority, category, and cost</text>
  <text x="720" y="378" class="copy">- Standardize labels and values</text>
  <text x="720" y="410" class="copy">- Add routing and summary fields</text>

  <rect x="1012" y="210" width="346" height="264" rx="24" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text x="1038" y="244" class="kicker">Stage 3</text>
  <text x="1038" y="278" class="cardTitle">Validation and business outputs</text>
  <text x="1038" y="316" class="copy">- Check required fields, dates, and values</text>
  <text x="1038" y="348" class="copy">- Separate approved rows from exceptions</text>
  <text x="1038" y="380" class="copy">- Export files for review and reporting</text>
  <text x="1038" y="412" class="copy">- Write validation issue log</text>

  <line x1="332" y1="342" x2="388" y2="342" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="388,342 364,327 364,357" fill="#226FB2"/>

  <line x1="638" y1="342" x2="694" y2="342" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="694,342 670,327 670,357" fill="#226FB2"/>

  <line x1="956" y1="342" x2="1012" y2="342" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1012,342 988,327 988,357" fill="#226FB2"/>

  <line x1="825" y1="474" x2="825" y2="528" stroke="#0E7B74" stroke-width="6" stroke-linecap="round"/>
  <line x1="1186" y1="474" x2="1186" y2="528" stroke="#0E7B74" stroke-width="6" stroke-linecap="round"/>

  <rect x="736" y="528" width="178" height="96" rx="20" fill="#F7F9FD" stroke="#D7E2EC"/>
  <text x="762" y="562" class="kicker">Control Layer</text>
  <text x="762" y="595" class="copy">validation_issues</text>

  <rect x="950" y="528" width="408" height="208" rx="24" fill="#F7FCFB" stroke="#B8DDD5"/>
  <text x="978" y="562" class="kicker">Outputs</text>
  <text x="978" y="590" class="muted">Approved data products and review artifacts</text>

  <rect x="978" y="614" width="352" height="34" rx="17" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="998" y="636" class="pill">master_operational_intake.xlsx</text>

  <rect x="978" y="660" width="238" height="34" rx="17" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="998" y="682" class="pill">exceptions_queue.csv</text>

  <rect x="1228" y="660" width="102" height="34" rx="17" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="1257" y="682" class="pill">.xlsx</text>

  <rect x="978" y="706" width="204" height="34" rx="17" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="998" y="728" class="pill">validation_results.csv</text>

  <rect x="1194" y="706" width="136" height="34" rx="17" fill="#FFFFFF" stroke="#C8E7DF"/>
  <text x="1215" y="728" class="pill">dashboard.html</text>
</svg>
