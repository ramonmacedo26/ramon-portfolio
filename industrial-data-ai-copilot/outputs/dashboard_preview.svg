  </defs>

  <rect width="1200" height="620" rx="0" fill="#F3EFE7"/>
  <g filter="url(#shadow)">
    <rect x="36" y="42" width="1128" height="536" rx="32" fill="#F7FBFF"/>
  </g>

  <rect x="68" y="72" width="1064" height="116" rx="24" fill="url(#bg)"/>
