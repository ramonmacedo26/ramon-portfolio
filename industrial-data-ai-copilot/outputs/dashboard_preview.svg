  <text x="102" y="176" class="subtitle">Bronze/Silver/Gold pipeline • quality checks • risk scoring • work-order briefs</text>
  <rect x="896" y="103" width="200" height="52" rx="18" fill="rgba(255,255,255,0.12)"/>
  <text x="922" y="125" class="small">Synthetic operations case</text>
  <text x="922" y="146" class="small">No client or employer data</text>

  <rect x="86" y="220" width="214" height="116" rx="20" fill="#FFFFFF" stroke="#DCE6EF"/>
