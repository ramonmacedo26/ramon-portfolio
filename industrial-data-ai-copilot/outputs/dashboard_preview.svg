<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none">
  <defs>
    <linearGradient id="bg" x1="86" y1="52" x2="1116" y2="566" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D2032"/>
      <stop offset="0.52" stop-color="#143E62"/>
      <stop offset="1" stop-color="#115C4B"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F05A4F"/>
      <stop offset="1" stop-color="#FDBB57"/>
    </linearGradient>
    <linearGradient id="healthy" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2EAD7B"/>
      <stop offset="1" stop-color="#63D4A4"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#102237" flood-opacity="0.14"/>
    </filter>
    <style>
      .eyebrow { font: 700 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.8px; text-transform: uppercase; fill: #A8C8DE; }
      .title { font: 800 40px 'Segoe UI', Arial, sans-serif; fill: #F3F8FC; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #D2E1EC; }
      .label { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.3px; text-transform: uppercase; fill: #6C7E90; }
      .metric { font: 800 30px 'Segoe UI', Arial, sans-serif; fill: #11273D; }
      .metric-note { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #5F7388; }
      .panel-title { font: 800 22px 'Segoe UI', Arial, sans-serif; fill: #11273D; }
      .asset { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #18324A; }
      .score { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #5E7083; }
      .foot { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #8A98A6; }
      .small { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #EAF4FB; }
