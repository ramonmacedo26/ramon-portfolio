  <rect x="760" y="554" width="124" height="14" rx="7" fill="url(#healthy)"/>
  <text x="760" y="588" class="score">40/100 · healthy · 2 anomalies · monitor only</text>

  <text x="86" y="592" class="foot">Generated from synthetic industrial data for portfolio use.</text>
